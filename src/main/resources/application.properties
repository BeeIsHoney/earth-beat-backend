spring.application.name=Earth-jukebox
spring.datasource.url=jdbc:mysql://localhost:3306/earthDb
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

earth.nasa.csv-url=https://data.giss.nasa.gov/gistemp/tabledata_v4/GLB.Ts%2BdSST.csv
earth.nasa.import-on-startup=true
earth.nasa.refresh-cron=0 0 2 * * *
earth.frontend.allowed-origins=http://localhost:3000,http://localhost:5173

earth.sound.anomaly-min-c=-0.6
earth.sound.anomaly-max-c=1.6
earth.sound.frequency-min-hz=180
earth.sound.frequency-max-hz=880
earth.sound.duration-ms=450

