spring.application.name=Earth-jukebox
server.port=${PORT:8080}

spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=${JPA_OPEN_IN_VIEW:false}

earth.nasa.csv-url=${NASA_CSV_URL:https://data.giss.nasa.gov/gistemp/tabledata_v4/GLB.Ts%2BdSST.csv}
earth.nasa.import-on-startup=${NASA_IMPORT_ON_STARTUP:true}
earth.nasa.refresh-cron=${NASA_REFRESH_CRON:0 0 2 * * *}

earth.frontend.allowed-origins=${FRONTEND_URL:http://localhost:3000},http://localhost:5173

earth.sound.anomaly-min-c=${SOUND_ANOMALY_MIN:-0.6}
earth.sound.anomaly-max-c=${SOUND_ANOMALY_MAX:1.6}
earth.sound.frequency-min-hz=${SOUND_FREQUENCY_MIN:180}
earth.sound.frequency-max-hz=${SOUND_FREQUENCY_MAX:880}
earth.sound.duration-ms=${SOUND_DURATION_MS:450}